name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find include src sim tests fuzz examples -name '*.[ch]' -print0 \
            | xargs -0 clang-format-18 --dry-run -Werror

  host:
    name: host build + tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (-Wall -Wextra -Werror)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Simulator noise sweep (deterministic, seed 42; fails on dup/corrupt delivery or timeout)
        run: ./build/tl_sim --sweep --seed 42
      - name: Fuzz seed corpus is reproducible from fuzz/make_seeds.py
        if: matrix.cc == 'gcc'
        run: |
          python3 fuzz/make_seeds.py
          git diff --exit-code fuzz/seeds
          test -z "$(git status --porcelain fuzz/seeds)"

  sanitizers:
    name: sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      # Ubuntu 24.04 runners use 32 bits of mmap ASLR entropy, which clang 18's
      # ThreadSanitizer cannot map around ("unexpected memory mapping").
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DTL_SANITIZE=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: libFuzzer (60 s per target)
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTL_BUILD_FUZZ=ON -DTL_BUILD_TESTS=OFF -DTL_BUILD_SIM=OFF
      - name: Build
        run: cmake --build build
      - name: Fuzz COBS codec
        run: |
          mkdir -p corpus_cobs
          ./build/fuzz_cobs -max_total_time=60 -print_final_stats=1 corpus_cobs fuzz/seeds
      - name: Fuzz link receive path
        run: |
          mkdir -p corpus_link
          ./build/fuzz_link -max_total_time=60 -print_final_stats=1 corpus_link fuzz/seeds
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  arm:
    name: ARM Cortex-M4 + Cortex-M0 cross-compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install arm-none-eabi toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: >
          cmake -S . -B build-arm -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - name: Build library + example firmware
        run: cmake --build build-arm
      - name: Code size
        run: |
          arm-none-eabi-size build-arm/libtl.a build-arm/firmware.elf
          cat build-arm/CMakeFiles/tl.dir/src/*.su | sort -t$'\t' -k2 -n -r | head -5
      - name: Configure Cortex-M0 (ARMv6-M, library only)
        run: >
          cmake -S . -B build-m0 -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-cortex-m0.cmake
          -DTL_BUILD_FIRMWARE_EXAMPLE=OFF
      - name: Build Cortex-M0 library
        run: cmake --build build-m0
      - name: Cortex-M0 has no libatomic calls (atomics are inline ldr/str + dmb)
        run: |
          arm-none-eabi-size build-m0/libtl.a
          if arm-none-eabi-nm -u build-m0/libtl.a | grep -E '__(atomic|sync)_'; then
            echo "libtl.a needs atomic library calls on Cortex-M0" >&2
            exit 1
          fi
